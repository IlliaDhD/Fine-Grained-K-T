apiVersion: apps/v1
kind: Deployment
metadata:
  name: pep-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pep-app
  template:
    metadata:
      labels:
        app: v
    spec:
      containers:
        - name: pep-app
          image: pep-app
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
          - name: KEYCLOAK_HOST
            value: 'http://keycloak:8080'
          - name: REALM_NAME
            value: 'policies-test'
          - name: CLIENT_ID
            value: 'test_client'
---
apiVersion: v1
kind: Service
metadata:
  name: pep-app
spec:
  selector:
    app: pep-app
  ports:
    - port: 80
      targetPort: 5000
